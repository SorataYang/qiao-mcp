name: Publish to PyPI

on:
  push:
    branches: [develop]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      upload_artifacts: true

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qiao-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check if version exists on TestPyPI
        id: check
        run: |
          package_http_code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://test.pypi.org/pypi/qiao-mcp/${{ needs.build.outputs.version }}/json")
          case "$package_http_code" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected TestPyPI response: $package_http_code" >&2; exit 1 ;;
          esac

      - name: Publish to TestPyPI
        if: steps.check.outputs.exists == 'false'
        run: uvx twine upload --repository testpypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}

      - name: Skip - version already exists
        if: steps.check.outputs.exists == 'true'
        run: echo "Version ${{ needs.build.outputs.version }} already exists on TestPyPI, skipping."

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/qiao-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Publish to PyPI
        run: uvx twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
