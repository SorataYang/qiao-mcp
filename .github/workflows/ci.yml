name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_call:
    inputs:
      upload_artifacts:
        description: Upload the distributions after all checks pass
        type: boolean
        default: false
    outputs:
      version:
        description: Verified distribution version
        value: ${{ jobs.quality.outputs.version }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # Match the locally verified frontend and the project's uv_build range.
          version: "0.11.6"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Ruff (lint)
        run: uv run --locked ruff check src/ tests/ scripts/

      - name: Mypy (type check)
        run: uv run --locked mypy src/qiao_mcp/

      - name: Pytest
        run: uv run --locked pytest tests/ --ignore=tests/test_end_to_end.py -q

      - name: Build distribution
        run: uv build

      - name: Check release metadata and source contents
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            uv run --locked python scripts/check_release.py dist --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
          else
            uv run --locked python scripts/check_release.py dist --github-output "$GITHUB_OUTPUT"
          fi

      - name: Check packaged MCP protocol and catalog without QiaoTong
        run: uv run --locked python scripts/check_mcp_package.py dist/*.whl

      - name: Upload verified distributions
        if: inputs.upload_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
