name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check src/ tests/

      - name: Mypy (type check)
        run: uv run mypy src/qiao_mcp/

      - name: Pytest
        run: uv run pytest tests/ --ignore=tests/test_end_to_end.py -q

      - name: Build distribution
        run: uv build

      - name: Check packaged MCP protocol and catalog without QiaoTong
        run: uv run python scripts/check_mcp_package.py dist/*.whl
