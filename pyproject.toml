[project]
name = "qiao-mcp"
version = "0.1.0"
description = "MCP server for intelligent bridge structural design and analysis (桥梁智能设计 MCP 服务器)"
readme = "README.md"
authors = [
    { name = "Sorata", email = "194564851+SorataYang@users.noreply.github.com" }
]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "numpy>=2.4.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    # qtmodel 自身未声明任何依赖，但 import 时需要 psutil/requests 等，须在此代为声明
    "psutil>=5.9",
    "qtmodel>=2.3.3,<2.4",
    "requests>=2.32.5",
]

[project.scripts]
qiao-mcp = "qiao_mcp.server:main"

[project.urls]
Homepage = "https://github.com/SorataYang/qiao-mcp"
Repository = "https://github.com/SorataYang/qiao-mcp"
Issues = "https://github.com/SorataYang/qiao-mcp/issues"

[build-system]
requires = ["uv_build>=0.9.28,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
